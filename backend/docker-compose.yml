services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - .:/var/www/html
    depends_on:
      - mysql
      - redis
      - meilisearch
    networks:
      - estateconnect

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - estateconnect

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: estateconnect
      MYSQL_USER: estateconnect
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - estateconnect

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - estateconnect

  meilisearch:
    image: getmeili/meilisearch:v1.10
    environment:
      MEILI_MASTER_KEY: masterKeyChangeMe
      MEILI_ENV: development
    ports:
      - "7700:7700"
    volumes:
      - meilisearch-data:/meili_data
    networks:
      - estateconnect

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - estateconnect

networks:
  estateconnect:

volumes:
  mysql-data:
  meilisearch-data:

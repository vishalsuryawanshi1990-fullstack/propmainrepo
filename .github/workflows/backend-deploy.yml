name: Backend Deploy

# Runs after "Backend CI" finishes on main — deploy only happens once
# lint/audit/migrate/test have all passed on that exact commit, not as
# a race against them.
on:
  workflow_run:
    workflows: ["Backend CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch: {}

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            cd ${{ secrets.VPS_DEPLOY_PATH }}
            php artisan down --secret="${{ secrets.MAINTENANCE_BYPASS_SECRET }}" || true
            git fetch origin main
            git reset --hard origin/main
            composer install --no-dev --optimize-autoloader --no-interaction
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan event:cache
            php artisan horizon:terminate || true
            php artisan reverb:restart || true
            php artisan up

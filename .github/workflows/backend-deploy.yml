name: Backend Deploy

# Runs after "Backend CI" finishes on main — deploy only happens once
# lint/audit/migrate/test have all passed on that exact commit, not as
# a race against them.
#
# Written for shared hosting (SSH access, no root, no persistent
# daemons): there's no Horizon/Reverb process to restart here — queued
# jobs run via a cron-driven `php artisan schedule:run` on the server
# (see routes/console.php), and realtime chat goes over Pusher instead
# of a self-hosted Reverb process. If this ever moves to a VPS, restore
# the `horizon:terminate`/`reverb:restart` steps removed from an
# earlier version of this file (see git history) and switch
# BROADCAST_CONNECTION back to reverb.
on:
  workflow_run:
    workflows: ["Backend CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch: {}

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            cd ${{ secrets.VPS_DEPLOY_PATH }}
            php artisan down --secret="${{ secrets.MAINTENANCE_BYPASS_SECRET }}" || true
            git fetch origin main
            git reset --hard origin/main
            composer install --no-dev --optimize-autoloader --no-interaction
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan event:cache
            php artisan up

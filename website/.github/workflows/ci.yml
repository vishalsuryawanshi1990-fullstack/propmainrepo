name: Website CI

# Lives under website/.github/workflows/ in the propmainrepo monorepo, where
# GitHub doesn't read it (only root .github/workflows/ counts there — see
# website-ci.yml). It becomes live once `git subtree split --prefix=website`
# lands this at the root of the standalone propwebsite repo.

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check and build
        env:
          API_BASE_URL: http://localhost:8000/api/v1
        run: npm run build
